<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeDevice // Root Gateway</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #070709;
            --glass-surface: rgba(16, 17, 22, 0.90);
            --border-subtle: rgba(255, 255, 255, 0.10);
            --matrix-green: #00ff66;
            --text-main: #f5f5f7;
            --text-muted: rgba(255, 255, 255, 0.60);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-base) !important;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* DIGITAL STREAM CANVAS */
        #binaryCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.40;
        }

        /* CURTAIN PRELOADER */
        #loader-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #17181f 0%, #070709 85%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999999;
            transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1);
            will-change: transform;
        }

        #loader-overlay.slide-away {
            transform: translateY(-100%);
            pointer-events: none;
        }

        .loader-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #loader-num {
            font-size: clamp(5.5rem, 13vw, 8.5rem);
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -3px;
        }

        .loader-track {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            margin-top: 18px;
            overflow: hidden;
        }

        #loader-fill {
            width: 0%;
            height: 100%;
            background: var(--matrix-green);
            box-shadow: 0 0 10px var(--matrix-green);
            transition: width 0.02s linear;
        }

        .loader-tag {
            margin-top: 16px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'JetBrains Mono', monospace;
        }

        /* GATEWAY CARD */
        .admin-card {
            background: var(--glass-surface) !important;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 38px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
            position: relative;
            z-index: 5;
        }

        .cyber-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid rgba(0, 255, 102, 0.35);
            color: var(--matrix-green);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 16px;
        }

        .admin-input {
            background-color: #121318 !important;
            border: 1px solid var(--border-subtle) !important;
            color: #ffffff !important;
            border-radius: 12px !important;
            padding: 13px 16px !important;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .admin-input:focus {
            border-color: rgba(0, 255, 102, 0.5) !important;
            box-shadow: 0 0 16px rgba(0, 255, 102, 0.15) !important;
            outline: none !important;
        }

        .btn-enter {
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
            border-radius: 12px;
            padding: 13px 24px;
            border: none;
            letter-spacing: 0.5px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
        }

        .btn-enter:hover {
            background-color: var(--matrix-green);
            color: #000000;
            transform: translateY(-1px);
        }

        .btn-subtle {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 11px 24px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
            text-align: center;
        }

        .btn-subtle:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- BINARY CANVAS -->
    <canvas id="binaryCanvas"></canvas>

    <!-- PRELOADER -->
    <div id="loader-overlay">
        <div class="loader-center">
            <div id="loader-num">0</div>
            <div class="loader-track">
                <div id="loader-fill"></div>
            </div>
            <div class="loader-tag">ROOT // SECURITY_GATE</div>
        </div>
    </div>

    <div class="container py-4" style="position: relative; z-index: 5;">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- FLASH NOTIFICATIONS -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-dark border border-danger border-opacity-25 text-white alert-dismissible fade show rounded-3 mb-3 admin-card p-3" role="alert">
                                <i class="bi bi-shield-x text-danger me-2"></i> {{ message }}
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="admin-card">
                    <div class="text-center mb-3">
                        <div class="cyber-badge">
                            <i class="bi bi-shield-lock-fill"></i> PRIVILEGED GATE
                        </div>
                        <h1 class="fw-bold text-white mb-1" style="font-size: 1.65rem; letter-spacing: -0.5px;">Root Access</h1>
                        <p class="text-secondary small mb-4">Authenticate administrative operator session</p>
                    </div>

                    <form method="POST" action="/admin/login" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label small text-secondary fw-bold" style="font-family: 'JetBrains Mono', monospace;">
                                &gt; OPERATOR_IDENTIFIER
                            </label>
                            <input type="text" name="admin_username" class="form-control admin-input" placeholder="Enter username" required autofocus maxlength="64">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-secondary fw-bold" style="font-family: 'JetBrains Mono', monospace;">
                                &gt; MASTER_SECURITY_KEY
                            </label>
                            <input type="password" name="admin_password" class="form-control admin-input" placeholder="••••••••••••" required maxlength="128">
                        </div>
                        <button type="submit" class="btn btn-enter w-100 mb-2">
                            <i class="bi bi-unlock-fill me-1"></i> AUTH_AND_ENTER
                        </button>
                        <a href="/" class="btn-subtle w-100">
                            <i class="bi bi-arrow-left me-1"></i> Return to Public View
                        </a>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- PRELOADER SCRIPT -->
    <script>
        (function () {
            const numEl = document.getElementById("loader-num");
            const fillEl = document.getElementById("loader-fill");
            const overlay = document.getElementById("loader-overlay");

            if (!numEl || !fillEl || !overlay) return;

            let current = 0;
            const duration = 1000;
            const stepTime = duration / 100;

            const interval = setInterval(() => {
                current++;
                numEl.textContent = current;
                fillEl.style.width = current + "%";

                if (current >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        overlay.classList.add("slide-away");
                    }, 120);
                }
            }, stepTime);
        })();
    </script>

    <!-- BINARY RAIN STREAM SCRIPT -->
    <script>
        const canvas = document.getElementById('binaryCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = '01';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1).map(() => Math.floor(Math.random() * -50));

        function drawBinaryRain() {
            ctx.fillStyle = 'rgba(7, 7, 9, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px "JetBrains Mono", monospace';

            for (let i = 0; i < drops.length; i++) {
                const char = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                if (Math.random() > 0.94) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                } else {
                    ctx.fillStyle = 'rgba(0, 255, 102, 0.35)';
                }

                ctx.fillText(char, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawBinaryRain, 33);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
