<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeDevice // ROOT_GATEWAY</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Cyber Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --matrix-green: #00ff66;
            --cyber-cyan: #00e5ff;
            --cyber-amber: #ffaa00;
            --dark-bg: #0a0e14;
            --panel-bg: rgba(13, 20, 30, 0.88);
            --panel-border: rgba(255, 170, 0, 0.4);
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: #d8e2dc;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #matrixCanvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            opacity: 0.28;
            pointer-events: none;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        .cyber-font {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1.5px;
        }

        .cyber-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.2);
        }

        .cyber-input {
            background-color: rgba(5, 8, 15, 0.85) !important;
            border: 1px solid var(--cyber-amber) !important;
            color: var(--cyber-amber) !important;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: inset 0 0 8px rgba(255, 170, 0, 0.2);
        }

        .cyber-input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.6), inset 0 0 10px rgba(255, 170, 0, 0.4) !important;
        }

        .btn-cyber-admin {
            background: transparent;
            color: var(--cyber-amber);
            border: 1px solid var(--cyber-amber);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
            transition: all 0.2s ease;
        }

        .btn-cyber-admin:hover {
            background: var(--cyber-amber);
            color: #000;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.9);
        }

        .btn-cyber-abort {
            border: 1px solid #64748b;
            color: #94a3b8;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-cyber-abort:hover {
            background: #64748b;
            color: #fff;
        }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-dark border border-{{ category }} text-{{ category }} alert-dismissible fade show cyber-card mb-3" role="alert">
                            <i class="bi bi-shield-x me-2"></i> {{ message }}
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card cyber-card p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-warning fs-1"></i>
                    <h4 class="cyber-font text-white mt-2 mb-1">ROOT_ACCESS_GATE</h4>
                    <p class="text-muted small">// ADMINISTRATIVE AUTHORIZATION REQUIRED</p>
                </div>

                <form method="POST" action="/admin/login">
                    <div class="mb-3">
                        <label class="form-label small text-warning fw-bold">&gt; ADMIN_USERNAME</label>
                        <input type="text" name="admin_username" class="form-control cyber-input" placeholder="root / admin" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-warning fw-bold">&gt; MASTER_PASSWORD</label>
                        <input type="password" name="admin_password" class="form-control cyber-input" placeholder="••••••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-cyber-admin btn-lg w-100 mb-2">
                        <i class="bi bi-unlock-fill me-1"></i> AUTH_AND_ENTER
                    </button>
                    <a href="/" class="btn btn-cyber-abort w-100">
                        <i class="bi bi-arrow-left"></i> PUBLIC_PORTAL
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    const chars = '0123456789ABCDEF01010101XYZ日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ';
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1).map(() => Math.floor(Math.random() * -50));
    function drawMatrix() {
        ctx.fillStyle = 'rgba(10, 14, 20, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const char = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillStyle = Math.random() > 0.92 ? '#ffffff' : '#00ff66';
            ctx.fillText(char, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 35);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
